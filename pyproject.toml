[project]
name = "jobmatch"
version = "0.4.0"
description = "Find Canadian contract postings, match them to contractors with the Gemini API, queue for human review."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "filelock>=3.13",
    # Fetching posting links that a person adds, and the Gemini REST API (v1).
    "httpx>=0.27",
    # Normalization (phase 2): HTML to text, mojibake repair.
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "ftfy>=6.2",
    # Fuzzy title dedupe (phase 3).
    "rapidfuzz>=3.6",
    # Postings saved as PDF in data/inbox/manual/ (text extraction, pure Python).
    "pypdf>=5.0",
]

[project.optional-dependencies]
# The desktop app (Mac .app, Windows .exe): UI in a native window. Not installed in Docker.
app = [
    "nicegui>=2.0",
    "pywebview>=5.0",
]

[project.scripts]
jobmatch = "jobmatch.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Packaging the desktop app; never shipped inside it.
build = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobmatch"]

# ---- uv: lock for the Docker runtime (linux/amd64) and the desktop app (Intel Mac, Windows) ----
[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
# Docker installs the default dependencies plus dev only (see Dockerfile).
default-groups = ["dev"]
# Only resolve releases at least ~2 weeks old (stability for the client machine). Move forward deliberately.
exclude-newer = "2026-10-05T00:00:00Z"

# ---- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# ---- ruff ----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
line-ending = "lf"
