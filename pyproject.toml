[project]
name = "jobmatch"
version = "0.1.0"
description = "Find Canadian contract postings, match them to contractors with local embeddings, queue for human review."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "filelock>=3.13",
    "numpy>=1.26",
    # CPU-only wheel from the PyTorch CPU index (see [tool.uv.sources]). Never add CUDA builds.
    "torch>=2.4",
    "transformers>=4.41",
    "sentence-transformers>=3.0",
    # Fetching posting links that a person adds (phase 3). Already in the lock via huggingface-hub.
    "httpx>=0.27",
    # Normalization (phase 2): HTML to text, mojibake repair.
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "ftfy>=6.2",
]

[project.scripts]
jobmatch = "jobmatch.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobmatch"]

# ---- uv: lock only for the Docker runtime (linux/amd64), torch from the CPU index ----
[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Only resolve releases at least ~2 weeks old (stability for the client machine). Move forward deliberately.
exclude-newer = "2026-10-05T00:00:00Z"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ---- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not model'"
markers = [
    "model: loads the real embedding model (downloads it on first use); run with `pytest -m model`",
]

# ---- ruff ----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
line-ending = "lf"
