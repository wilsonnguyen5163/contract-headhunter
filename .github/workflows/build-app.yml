# Build the desktop app, "do good talent": an Intel Mac dogoodtalent.app (in a .dmg) and a
# Windows dogoodtalent.exe (in a zip). The code package is still called jobmatch.
#
# Two ways to start it:
#   - Actions > build-app > Run workflow: a test build, downloadable from the run for 14 days.
#   - Push a tag like v0.2.0 (it must match "version" in pyproject.toml): the same build, then
#     a DRAFT GitHub Release with both files. Only repo owners see a draft until it's published.
# Each platform builds on its own runner (PyInstaller cannot cross-build). Every build:
#   1. on a tag, checks the tag matches pyproject.toml's version (stops a wrong tag early),
#   2. installs exactly what uv.lock pins (with the app extra and the build group),
#   3. runs the test suite (Gemini is always faked; no API key is used or needed),
#   4. builds with packaging/jobmatch.spec,
#   5. runs the finished app with --check (loads config and every module, opens no window),
#   6. uploads the .dmg / .zip as a download for 14 days.
# The release job runs only on a tag, only if both builds pass.
# No secrets are used (the release uses GitHub's built-in per-run token).
# data/, exports/ and .env are never in the repo or the build.
#
# macos-15-intel is GitHub's last Intel macOS runner (supported until fall 2027).

name: build-app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            artifact: dogoodtalent-mac-intel
          - os: windows-latest
            artifact: dogoodtalent-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      UV_PYTHON_DOWNLOADS: never
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v4

      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag matches the version (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $version (expected v$version)."
            exit 1
          fi

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.0" # same as the Dockerfile

      - name: Install (exactly uv.lock, app extra, build group)
        shell: bash
        run: uv sync --python "${{ steps.python.outputs.python-path }}" --extra app --group build

      - name: Tests
        shell: bash
        run: uv run --no-sync pytest -q

      - name: Build
        shell: bash
        run: uv run --no-sync pyinstaller packaging/jobmatch.spec --noconfirm --clean --distpath dist --workpath build

      - name: Check the app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bin=dist/dogoodtalent.app/Contents/MacOS/dogoodtalent
          echo "architecture: $(lipo -archs "$bin")"
          lipo -archs "$bin" | grep -q x86_64
          status=0
          "$bin" --check --data-root "$RUNNER_TEMP/jm" || status=$?
          cat "$RUNNER_TEMP/jm/check.txt" || true
          exit $status

      - name: Check the app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # A window app returns at once when started from a shell: wait for it explicitly.
          $p = Start-Process -FilePath "dist\dogoodtalent\dogoodtalent.exe" `
            -ArgumentList "--check", "--data-root", "$env:RUNNER_TEMP\jm" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\jm\check.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Package (macOS .dmg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # The disk image shows the app next to an Applications shortcut: drag to install.
          mkdir -p dist/dmg
          cp -R dist/dogoodtalent.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "do good talent" -srcfolder dist/dmg -ov -format UDZO "dist/${{ matrix.artifact }}.dmg"

      - name: Package (Windows .zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist\dogoodtalent" -DestinationPath "dist\${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: |
            dist/${{ matrix.artifact }}.dmg
            dist/${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    # Tags only, and only after both builds (tests and --check included) have passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release; this job only
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dogoodtalent-*-${{ github.sha }}
          merge-multiple: true
          path: dist

      - name: Create a draft release with both files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "do good talent $GITHUB_REF_NAME" \
            --notes "Mac (Intel): dogoodtalent-mac-intel.dmg. Windows: dogoodtalent-windows.zip. Unsigned: first-launch steps in doc/FIRST_LAUNCH.md." \
            dist/dogoodtalent-mac-intel.dmg dist/dogoodtalent-windows.zip
