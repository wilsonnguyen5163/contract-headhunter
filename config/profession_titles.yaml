# Title phrases that place a JOB in a profession without any model (v1 prefilter, step 1 of
# doc/V1_PLAN.md section 7). Keys are profession names from professions.yaml.
#
# How they will be used (phase 3, llm/classify.py): the job's cleaned title is compared,
# whole words only, case- and accent-insensitive; the longest phrase found wins. A title with
# no phrase, or with phrases from two professions that are not in the same `close` group,
# is "unclear" and goes to the batched Gemini classifier, or gets the full roster.
#
# Keep phrases specific: bare "manager", "analyst", "coordinator", "consultant", "specialist"
# fit many professions and are left out on purpose. A phrase may appear under one profession
# only (checked on load). Seniority words are not needed: they are removed from titles.
# First draft 2026-11-05 (GUESS); widen it from the "unclear" list after real runs.
