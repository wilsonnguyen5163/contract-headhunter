# Canadian location lookup, v1 (hand-written; extend as postings show gaps).
# Names and terms match case- and accent-insensitively as whole words;
# province abbreviations match case-sensitively ("ON", never the word "on").
version: 1

provinces:
  CA-AB: { names: [alberta], abbreviations: [AB, Alta., ALTA] }
  CA-BC: { names: [british columbia, colombie-britannique], abbreviations: [BC, B.C., C.-B., CB] }
  CA-MB: { names: [manitoba], abbreviations: [MB, Man.] }
  CA-NB: { names: [new brunswick, nouveau-brunswick], abbreviations: [NB, N.B., N.-B.] }
  CA-NL:
    names: [newfoundland and labrador, terre-neuve-et-labrador, newfoundland, terre-neuve, labrador]
    abbreviations: [NL, N.L., T.-N.-L., NFLD]
  CA-NS: { names: [nova scotia, nouvelle-écosse], abbreviations: [NS, N.S., N.-É.] }
  CA-NT:
    names: [northwest territories, territoires du nord-ouest]
    abbreviations: [NT, NWT, N.W.T., T.N.-O.]
  CA-NU: { names: [nunavut], abbreviations: [NU] }
  CA-ON: { names: [ontario], abbreviations: ["ON", Ont., ONT] } # quoted: YAML reads bare ON as true
  CA-PE:
    names: [prince edward island, île-du-prince-édouard]
    abbreviations: [PE, PEI, P.E.I., Î.-P.-É.]
  CA-QC:
    names: [quebec, québec, province de québec, province of quebec]
    abbreviations: [QC, Qc, Qué., QUE, PQ]
  CA-SK: { names: [saskatchewan], abbreviations: [SK, Sask.] }
  CA-YT: { names: [yukon], abbreviations: [YT, Yuk.] }

