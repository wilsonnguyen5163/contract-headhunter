# jobmatch settings. Values marked GUESS are starting assumptions, to be tuned on reviewer data.
schema_version: 1

paths:
  # Relative paths resolve against the project root (the parent of this config folder).
  data_dir: data
  exports_dir: exports
  # Built by build-contractors from the master workbook; read by embed-contractors.
  contractors_csv: data/contractors/contractors.csv
  # Skills learned from the contractor list by build-contractors (generated; rules in
  # config/skill_learning.yaml). Loaded together with config/skills_taxonomy.yaml.
  learned_skills: data/contractors/skills_learned.yaml

storage:
  lock_timeout_seconds: 30 # GUESS: how long a run or the review UI waits for a CSV lock

embedding:
  # Changing the model needs approval and a full re-embed (embed-jobs, embed-contractors).
  # bge-m3: multilingual (EN/FR), 1024 dimensions, about 2.3 GB, approved on 2026-10-22.
  # Previous: intfloat/multilingual-e5-small at 614241f622f53c4eeff9890bdc4f31cfecc418b3,
  # with job_prefix "query: " and facet_prefix "passage: ".
  model_name: BAAI/bge-m3
  model_revision: 5617a9f61b028005a4858fdac845db406aefb181 # main commit at first download, 2026-10-22
  batch_size: 8 # GUESS: a bigger model, so smaller batches on the client's 1.4 GHz CPU
  # bge-m3 reads up to 8192 tokens. 512 until 2026-11-03, when it cut 35% of job texts
  # (median 440 tokens, longest 948). 1024 covers them all for ~15% more CPU time per job
  # (doc/PROTOTYPES.md). Part of the stored model version: changing it re-embeds everything.
  max_seq_length: 1024
  normalize_embeddings: true
  # bge-m3 dense vectors need no instruction prefix on either side.
  job_prefix: ""
  facet_prefix: ""

normalize:
  # TODO (reminder): 999 effectively turns the stale filter off, on purpose, while the
  # matching algorithm is being tested. Set a real limit (30 was the starting GUESS) and
  # consider an "expired" filter from JobPosting.validThrough before real use.
  freshness_days: 999
  contract_score_threshold: 0.8 # GUESS: net phrase score to call a posting contract (or, if negative, permanent)
  language_min_hits: 4 # GUESS: EN/FR function words needed before trusting language detection
  bilingual_min_share: 0.25 # GUESS: minority-language share of those words to call a text bilingual
  language_filter_min_words: 40 # GUESS: filter as unsupported language only for texts at least this long
  max_section_items: 20 # bullets kept per list (requirements, nice to have)
  max_responsibilities: 20 # bullets kept for responsibilities
  fuzzy_title_threshold: 92 # GUESS: 0-100 title similarity (same company, city, seniority) for a duplicate

matching: # phase 4. Every number here is a hyperparameter, to be tuned on reviewer data.
  top_k: 5 # shortlist size per job
  # GUESS: contractors scoring below this are not shortlisted. Raised from 0.30 on 2026-10-27:
  # on 111 judged pairs (data/eval/llm_judge_labels.csv, not blind) it removes 27 non-fits,
  # 6 partial fits and 1 fit; no reviewer A/B pair in data/eval scores below 0.40.
  # Raised to 0.45 on 2026-11-02: of 168 judged shortlist pairs (not blind), the 29 between
  # 0.40 and 0.45 held no fit (19 no, 10 partial); the lowest reviewer A/B pair scores 0.50.
  min_score: 0.45
  # Raw bge-m3 cosines sit in a narrow range; they are stretched to 0-1 between floor and
  # ceiling. Full texts and short titles score differently, so each has its own pair.
  cosine_floor: 0.45 # GUESS: about the least related pair seen on 2026-10-22
  cosine_ceiling: 0.80 # GUESS: about the closest pair seen on 2026-10-22
  title_floor: 0.50 # GUESS: job title vs the contractor's closest title
  title_ceiling: 0.85 # GUESS
  # Checked 2026-11-04 on 155 blind labels (data/eval/blind_consensus.csv; scripts/prototypes/
  # tune.py): 432 weight combinations, 20 x 5-fold cross-validation by job. The best weights
  # on the training jobs did worse than these on the held-out jobs (mean -0.005, worse in 56%
  # of folds), so these stay. Today: within-job fit>no 0.919, across jobs 0.927.
  weights: # a part with nothing to compare (no skills, no titles) is left out of the average
    cosine: 0.45 # GUESS: full job text vs full profile
    title: 0.30 # GUESS: job title vs the contractor's closest title
    skill_overlap: 0.25 # GUESS: share of the job's skills the contractor has
    field: 0.20 # GUESS (0.10 until 2026-10-26: too light to keep sales profiles off an HR role)
    # GUESS: TF-IDF word overlap of the raw posting and profile, no skill list (2026-11-02,
    # doc/PROTOTYPES.md). Sweep on 381 judged pairs: 0.2 is the best balance; more helps
    # no-match detection a little but hurts the order within a job. Gains are within noise.
    lexical: 0.20
  # Skill categories used across every type of work, so they say nothing about it.
  field_ignore_categories: [management, business, learned]
  bands: # on the final score
    high: 0.70 # GUESS
    # GUESS: 0.50 until 2026-11-02. On 381 judged pairs, 4% of pairs below 0.60 are fits,
    # 21% at 0.60-0.65 and 45-93% above, so "medium" now starts at 0.60.
    medium: 0.60
    # 2026-11-04, 155 blind labels: 80% of pairs scoring 0.60+ are fits (0.60-0.70: 74%,
    # 0.70+: 86%), 10% at 0.45-0.60 and 3% below 0.45. The sheet over-samples hard pairs, so
    # read these as relative, not absolute.
  # A posting's skill tags can run to a dozen; sharing 3 of 12 should still count. The skill
  # part is shared skills / min(job's skill count, this cap), so at most 1.
  skill_overlap_cap: 4 # GUESS
  # A thin profile (no summary, no core strengths) has too little text for the full-text
  # comparison to be fair; true scores it on title and skills only.
  thin_profiles_skip_text: true
  missing_must_have_lowers_band: false # always shown; true also lowers the band one step
  seniority_max_gap: 1 # GUESS: levels apart (junior..executive) before a seniority check fails
  # User decision 2026-10-26: treat all contract work as remote for now, so the location
  # check always passes. false turns on the province check (on-site/hybrid job vs the
  # contractor's province).
  assume_all_remote: true
  hours_per_year: 2080 # converts yearly/monthly/weekly/daily job pay to hourly (40 h weeks)
  rate_tolerance: 1.25 # GUESS: note when a contractor's rate is above the job's top hourly pay times this
  # TF-IDF cosines run low: on 2026-11-02 the median pair was 0.022, the median labelled fit
  # 0.096 and the 99th percentile 0.127. Stretched from [floor, ceiling] to [0, 1].
  lexical_floor: 0.0
  lexical_ceiling: 0.10 # GUESS: about a typical fit gets full credit
  # Words too common to say anything (EN/FR, accent-insensitive). Rare words already count
  # more; this list only drops the commonest.
  lexical_stopwords: [the, and, for, with, you, our, are, will, this, that, your, from, have, has, who, all, can, not, des, les, une, pour, avec, dans, sur, par, aux, est, vous, nous, qui, que, job, role, team, work]

exports:
  trial_run_per_job: 2 # contractors per job in exports/trial-run-<time>.csv (export-trial-run)

logging:
  level: INFO

# v1: matching with the Gemini API (doc/V1_PLAN.md). Free tier only. The key is read from the
# environment variable named in api_key_env (set it in .env, never here).
llm:
  provider: gemini
  model: gemini-3.5-flash-lite
  base_url: https://generativelanguage.googleapis.com/v1beta
  api_key_env: GEMINI_API_KEY
  temperature: 0
  max_output_tokens: 4096 # GUESS: one job's verdicts plus 5 detailed matches use about 1-1.5k
  # For Gemini 3 models set thinking_budget: null and thinking_level: low instead.
  # 2026-11-05: gemini-3.5-flash-lite is a Gemini 3 model, so thinking_level (GUESS: minimal).
  thinking_budget: null
  thinking_level: minimal
  timeout_seconds: 120
  max_retries: 3 # per-minute 429, 5xx and network errors; a daily-limit 429 is never retried
  retry_base_seconds: 5 # GUESS: doubles each try unless Google says how long to wait
  top_k: 5 # contractors described in detail per job (every contractor still gets a verdict)
  jobs_per_call: 1 # >1 packs several jobs of one profession per call (only if RPD is tight)
  limits:
    # GUESS until copied from AI Studio for our project and model (doc/V1_PLAN.md Q1).
    rpm: 15
    tpm: 250000
    rpd: 500
    tpd: null
  budget:
    drain_warn_share: 0.8 # GUESS: stop a run that would use more than 80% of what is left today
    call_max_tpm_share: 0.5 # GUESS: never send one call estimated above 50% of tpm
  payload:
    chars_per_token: 4 # GUESS: local estimate; the API's own count is logged after each call
    max_job_tokens: 1200 # GUESS: v0 job texts were 440 tokens median, 948 at most
    summary_max_words: 80 # GUESS
    max_list_items: 15 # GUESS: per contractor list (skills, keywords, titles)
    expected_output_tokens: 1500 # GUESS: for budget estimates only
  prefilter:
    enabled: false # stays off until the offline recall check passes (V1_PLAN section 7)
    min_roster: 3 # GUESS: fewer eligible contractors than this widens the roster
