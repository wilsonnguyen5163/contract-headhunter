# Skill taxonomy v1: canonical skill (lowercase key) -> synonyms in English and French.
# Matching is case- and accent-insensitive and whole-word ("java" never matches "javascript").
# Each alias may belong to one skill only (checked on load).
# Ambiguous everyday words are left out on purpose (go, swift, spring, vue, node, tableau,
# lean, safe, docker containers...): add a longer, unambiguous alias instead.
# Fields are diverse; extend this file as real contractor profiles and postings come in.
